<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1280" height="720" fill="#F7F9FC"/>
  <rect x="0" y="0" width="1280" height="10" fill="#12355B"/>
  <rect x="0" y="0" width="220" height="10" fill="#00A88E"/>

  <text x="60" y="62" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="31" font-weight="700" fill="#12355B">{{PAGE_TITLE}}</text>
  <rect x="60" y="84" width="1090" height="40" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
  <rect x="60" y="84" width="8" height="40" rx="4" fill="#00A88E"/>
  <text x="84" y="110" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1F2937">{{KEY_MESSAGE}}</text>

  <rect x="100" y="162" width="760" height="440" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
  <line x1="480" y1="188" x2="480" y2="566" stroke="#94A3B8" stroke-width="2"/>
  <line x1="130" y1="382" x2="830" y2="382" stroke="#94A3B8" stroke-width="2"/>
  <line x1="480" y1="566" x2="480" y2="188" stroke="#2F6BFF" stroke-width="3"/>
  <line x1="130" y1="382" x2="830" y2="382" stroke="#2F6BFF" stroke-width="3"/>

  <text x="480" y="154" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#64748B">{{MATRIX_Y_LABEL}}</text>
  <text x="480" y="626" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#64748B">{{MATRIX_X_LABEL}}</text>

  <g id="strategy_quadrants" font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="152" y="210" width="286" height="132" rx="8" fill="#E6F7F4" stroke="#A8E3D9" stroke-width="1"/>
    <text x="176" y="250" font-size="18" font-weight="700" fill="#007C6B">{{QUADRANT_1_TITLE}}</text>
    <text x="176" y="282" font-size="14" fill="#64748B">高价值 / 高可行</text>
    <text x="176" y="312" font-size="13" fill="#64748B">优先投入、形成年度重点工程</text>

    <rect x="522" y="210" width="286" height="132" rx="8" fill="#EEF3FF" stroke="#BFD0FF" stroke-width="1"/>
    <text x="546" y="250" font-size="18" font-weight="700" fill="#2F6BFF">{{QUADRANT_2_TITLE}}</text>
    <text x="546" y="282" font-size="14" fill="#64748B">高价值 / 低可行</text>
    <text x="546" y="312" font-size="13" fill="#64748B">拆解约束、建立试点验证</text>

    <rect x="152" y="422" width="286" height="132" rx="8" fill="#F8FAFC" stroke="#D8E1EA" stroke-width="1"/>
    <text x="176" y="462" font-size="18" font-weight="700" fill="#12355B">{{QUADRANT_3_TITLE}}</text>
    <text x="176" y="494" font-size="14" fill="#64748B">低价值 / 高可行</text>
    <text x="176" y="524" font-size="13" fill="#64748B">低成本推进、纳入常规管理</text>

    <rect x="522" y="422" width="286" height="132" rx="8" fill="#FFF7E6" stroke="#FAD999" stroke-width="1"/>
    <text x="546" y="462" font-size="18" font-weight="700" fill="#B66A00">{{QUADRANT_4_TITLE}}</text>
    <text x="546" y="494" font-size="14" fill="#64748B">低价值 / 低可行</text>
    <text x="546" y="524" font-size="13" fill="#64748B">暂缓、退出或仅保留观察</text>
  </g>

  <rect x="900" y="162" width="320" height="440" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
  <text x="928" y="206" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#12355B">矩阵使用建议</text>
  <line x1="928" y1="226" x2="1192" y2="226" stroke="#D8E1EA" stroke-width="1"/>
  <text x="928" y="272" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748B">1. 用横轴表达资源/可行性。</text>
  <text x="928" y="314" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748B">2. 用纵轴表达战略价值。</text>
  <text x="928" y="356" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748B">3. 每个象限放 2-4 个议题。</text>
  <text x="928" y="398" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#64748B">4. 右侧补充决策口径。</text>
  <rect x="928" y="462" width="240" height="78" rx="8" fill="#12355B"/>
  <text x="952" y="494" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#00A88E">OUTPUT</text>
  <text x="952" y="520" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#FFFFFF">形成优先级、取舍依据与资源请求</text>

  <text x="60" y="682" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" fill="#64748B">{{SECTION_NAME}}</text>
  <rect x="1168" y="664" width="52" height="24" rx="12" fill="#12355B"/>
  <text x="1194" y="681" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
