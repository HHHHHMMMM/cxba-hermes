<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FA"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#coverBg)"/>
  <rect x="0" y="0" width="1280" height="12" fill="#12355B"/>
  <rect x="0" y="0" width="260" height="12" fill="#00A88E"/>
  <rect x="0" y="12" width="88" height="708" fill="#12355B"/>
  <rect x="88" y="12" width="6" height="708" fill="#00A88E"/>

  <rect x="112" y="48" width="156" height="46" rx="6" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
  <text x="190" y="78" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#12355B">{{BRAND_LOGO}}</text>

  <text x="112" y="156" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#00A88E">STRATEGY &amp; OPERATIONS REVIEW</text>
  <text x="112" y="236" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="54" font-weight="700" fill="#12355B">{{TITLE}}</text>
  <text x="112" y="288" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="28" font-weight="600" fill="#1F2937">{{SUBTITLE}}</text>

  <rect x="112" y="326" width="230" height="34" rx="17" fill="#E6F7F4" stroke="#A8E3D9" stroke-width="1"/>
  <text x="227" y="349" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#007C6B">{{REPORT_PERIOD}}</text>

  <g id="strategy_pillar_cards" transform="translate(112, 420)">
    <rect x="0" y="0" width="245" height="120" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
    <rect x="0" y="0" width="245" height="8" rx="4" fill="#12355B"/>
    <text x="22" y="46" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#12355B">战略目标</text>
    <text x="22" y="78" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#64748B">增长路径与资源配置</text>

    <rect x="275" y="0" width="245" height="120" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
    <rect x="275" y="0" width="245" height="8" rx="4" fill="#00A88E"/>
    <text x="297" y="46" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#12355B">经营绩效</text>
    <text x="297" y="78" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#64748B">收入、利润与现金流</text>

    <rect x="550" y="0" width="245" height="120" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
    <rect x="550" y="0" width="245" height="8" rx="4" fill="#2F6BFF"/>
    <text x="572" y="46" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#12355B">关键举措</text>
    <text x="572" y="78" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#64748B">项目组合与里程碑</text>

    <rect x="825" y="0" width="245" height="120" rx="8" fill="#FFFFFF" stroke="#D8E1EA" stroke-width="1"/>
    <rect x="825" y="0" width="245" height="8" rx="4" fill="#F59E0B"/>
    <text x="847" y="46" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#12355B">风险机会</text>
    <text x="847" y="78" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#64748B">约束、假设与应对</text>
  </g>

  <line x1="112" y1="606" x2="1188" y2="606" stroke="#D8E1EA" stroke-width="1"/>
  <text x="112" y="648" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748B">{{AUTHOR}}</text>
  <text x="1188" y="648" text-anchor="end" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748B">{{DATE}}</text>
